name: Build

on:
  push:
    branches: [frame-build]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write release signing config
        if: env.HAS_SIGNING == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
            echo "KEY_PASSWORD=$KS_KEY_PASS"
          } > signing.properties

      - name: Build
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            ./gradlew assembleDebug assembleRelease
          else
            echo "No signing secrets; building debug only"
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
